<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Design around the query</title><desc id="desc">사용자별 최신 주문을 조회하는 예시. 사용자로 범위 좁히기 → 사용자 안에서 날짜 정렬 → 필요한 행만 반환. 인덱스 선택과 효과는 실제 실행 계획으로 확인합니다.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#d9e3ef" stroke-width=".5"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#7798bd" stroke-width="1"/></marker></defs><rect width="960" height="480" rx="12" fill="#edf2f8"/><rect width="960" height="480" rx="12" fill="url(#grid)"/><g font-family="Pretendard, 'Segoe UI', 'Malgun Gothic', sans-serif"><text x="64" y="55" fill="#3f6fa6" font-size="12" font-weight="600" letter-spacing="2">SQL / FIELD NOTES</text><text x="64" y="103" fill="#243a55" font-size="32" font-weight="600" letter-spacing="-.5">Design around the query</text><text x="64" y="135" fill="#63758a" font-size="16">사용자별 최신 주문을 조회하는 예시</text><g><rect x="64" y="192" width="240" height="128" rx="10" fill="#fff" stroke="#cad8e8"/><text x="82" y="220" fill="#70849b" font-size="11" letter-spacing="1">01 / FILTER</text><text x="82" y="260" fill="#2d527f" font-size="18" font-weight="600">user_id = 42</text><text x="82" y="291" fill="#63758a" font-size="14">사용자로 범위 좁히기</text></g><path d="M312 256H352" stroke="#7798bd" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect x="360" y="192" width="240" height="128" rx="10" fill="#fff" stroke="#cad8e8"/><text x="378" y="220" fill="#70849b" font-size="11" letter-spacing="1">02 / ORDER</text><text x="378" y="260" fill="#2d527f" font-size="18" font-weight="600">created_at DESC</text><text x="378" y="291" fill="#63758a" font-size="14">사용자 안에서 날짜 정렬</text></g><path d="M608 256H648" stroke="#7798bd" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect x="656" y="192" width="240" height="128" rx="10" fill="#fff" stroke="#cad8e8"/><text x="674" y="220" fill="#70849b" font-size="11" letter-spacing="1">03 / LIMIT</text><text x="674" y="260" fill="#2d527f" font-size="18" font-weight="600">LIMIT 20</text><text x="674" y="291" fill="#63758a" font-size="14">필요한 행만 반환</text></g><path d="M64 358H896" stroke="#c7d5e6"/><text x="64" y="390" fill="#3f6fa6" font-family="monospace" font-size="14">CANDIDATE INDEX  (user_id, created_at DESC)</text><text x="64" y="422" fill="#63758a" font-size="13">인덱스 선택과 효과는 실제 실행 계획으로 확인합니다.</text><text x="896" y="445" fill="#3f6fa6" font-family="Georgia, serif" font-size="22" font-weight="700" text-anchor="end">deuk.</text></g></svg>
