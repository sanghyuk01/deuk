<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Identity, equality, and hashing</title><desc id="desc">참조 동일성과 값 동등성을 구분하기. 같은 객체를 가리키는가 → 정의한 동등성 기준 → 동등하면 같은 해시 코드. 같은 해시 코드가 곧 동등한 객체를 의미하지는 않습니다.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#d9e3ef" stroke-width=".5"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#7798bd" stroke-width="1"/></marker></defs><rect width="960" height="480" rx="12" fill="#edf2f8"/><rect width="960" height="480" rx="12" fill="url(#grid)"/><g font-family="Pretendard, 'Segoe UI', 'Malgun Gothic', sans-serif"><text x="64" y="55" fill="#3f6fa6" font-size="12" font-weight="600" letter-spacing="2">JAVA / FIELD NOTES</text><text x="64" y="103" fill="#243a55" font-size="32" font-weight="600" letter-spacing="-.5">Identity, equality, and hashing</text><text x="64" y="135" fill="#63758a" font-size="16">참조 동일성과 값 동등성을 구분하기</text><g><rect x="64" y="192" width="240" height="128" rx="10" fill="#fff" stroke="#cad8e8"/><text x="82" y="220" fill="#70849b" font-size="11" letter-spacing="1">01 / REFERENCE</text><text x="82" y="260" fill="#2d527f" font-size="18" font-weight="600">a == b</text><text x="82" y="291" fill="#63758a" font-size="14">같은 객체를 가리키는가</text></g><path d="M312 256H352" stroke="#7798bd" stroke-width="1.5" stroke-dasharray="3 4"/><g><rect x="360" y="192" width="240" height="128" rx="10" fill="#fff" stroke="#cad8e8"/><text x="378" y="220" fill="#70849b" font-size="11" letter-spacing="1">02 / VALUE</text><text x="378" y="260" fill="#2d527f" font-size="18" font-weight="600">a.equals(b)</text><text x="378" y="291" fill="#63758a" font-size="14">정의한 동등성 기준</text></g><path d="M608 256H648" stroke="#7798bd" stroke-width="1.5" stroke-dasharray="3 4"/><g><rect x="656" y="192" width="240" height="128" rx="10" fill="#fff" stroke="#cad8e8"/><text x="674" y="220" fill="#70849b" font-size="11" letter-spacing="1">03 / CONTRACT</text><text x="674" y="260" fill="#2d527f" font-size="18" font-weight="600">hashCode()</text><text x="674" y="291" fill="#63758a" font-size="14">동등하면 같은 해시 코드</text></g><path d="M64 358H896" stroke="#c7d5e6"/><text x="64" y="390" fill="#3f6fa6" font-family="monospace" font-size="14">EQUAL OBJECTS → EQUAL HASH CODES</text><text x="64" y="422" fill="#63758a" font-size="13">같은 해시 코드가 곧 동등한 객체를 의미하지는 않습니다.</text><text x="896" y="445" fill="#3f6fa6" font-family="Georgia, serif" font-size="22" font-weight="700" text-anchor="end">deuk.</text></g></svg>
