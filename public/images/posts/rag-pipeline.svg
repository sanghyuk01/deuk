<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Retrieve before you generate</title><desc id="desc">외부 문서를 답변의 근거로 연결하기. 문서 · 청크 · 검색 인덱스 → 질문과 관련된 자료 검색 → 질문과 근거 자료 구성 → 자료에 근거한 답변. 검색 품질과 답변의 근거 일치 여부를 각각 확인합니다.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#d9e3ef" stroke-width=".5"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#7798bd" stroke-width="1"/></marker></defs><rect width="960" height="480" rx="12" fill="#edf2f8"/><rect width="960" height="480" rx="12" fill="url(#grid)"/><g font-family="Pretendard, 'Segoe UI', 'Malgun Gothic', sans-serif"><text x="64" y="55" fill="#3f6fa6" font-size="12" font-weight="600" letter-spacing="2">RAG / FIELD NOTES</text><text x="64" y="103" fill="#243a55" font-size="32" font-weight="600" letter-spacing="-.5">Retrieve before you generate</text><text x="64" y="135" fill="#63758a" font-size="16">외부 문서를 답변의 근거로 연결하기</text><g><rect x="64" y="192" width="184" height="128" rx="10" fill="#fff" stroke="#cad8e8"/><text x="82" y="220" fill="#70849b" font-size="11" letter-spacing="1">01 / PREPARE</text><text x="82" y="260" fill="#2d527f" font-size="17" font-weight="600">DOCUMENTS</text><text x="82" y="291" fill="#63758a" font-size="12">문서 · 청크 · 검색 인덱스</text></g><path d="M256 256H272" stroke="#7798bd" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect x="280" y="192" width="184" height="128" rx="10" fill="#fff" stroke="#cad8e8"/><text x="298" y="220" fill="#70849b" font-size="11" letter-spacing="1">02 / RETRIEVE</text><text x="298" y="260" fill="#2d527f" font-size="17" font-weight="600">RETRIEVAL</text><text x="298" y="291" fill="#63758a" font-size="12">질문과 관련된 자료 검색</text></g><path d="M472 256H488" stroke="#7798bd" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect x="496" y="192" width="184" height="128" rx="10" fill="#fff" stroke="#cad8e8"/><text x="514" y="220" fill="#70849b" font-size="11" letter-spacing="1">03 / AUGMENT</text><text x="514" y="260" fill="#2d527f" font-size="17" font-weight="600">CONTEXT</text><text x="514" y="291" fill="#63758a" font-size="12">질문과 근거 자료 구성</text></g><path d="M688 256H704" stroke="#7798bd" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect x="712" y="192" width="184" height="128" rx="10" fill="#fff" stroke="#cad8e8"/><text x="730" y="220" fill="#70849b" font-size="11" letter-spacing="1">04 / GENERATE</text><text x="730" y="260" fill="#2d527f" font-size="17" font-weight="600">ANSWER</text><text x="730" y="291" fill="#63758a" font-size="12">자료에 근거한 답변</text></g><path d="M64 358H896" stroke="#c7d5e6"/><text x="64" y="390" fill="#3f6fa6" font-family="monospace" font-size="14">QUESTION + RETRIEVED CONTEXT → GENERATION</text><text x="64" y="422" fill="#63758a" font-size="13">검색 품질과 답변의 근거 일치 여부를 각각 확인합니다.</text><text x="896" y="445" fill="#3f6fa6" font-family="Georgia, serif" font-size="22" font-weight="700" text-anchor="end">deuk.</text></g></svg>
