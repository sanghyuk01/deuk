<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">From prompt to generation</title><desc id="desc">입력부터 다음 토큰 생성까지. 질문과 지시문 → 모델이 읽는 토큰 ID → 다음 토큰 생성 · 반복. 종료 조건에 도달할 때까지 생성합니다.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#d9e3ef" stroke-width=".5"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#7798bd" stroke-width="1"/></marker></defs><rect width="960" height="480" rx="12" fill="#edf2f8"/><rect width="960" height="480" rx="12" fill="url(#grid)"/><g font-family="Pretendard, 'Segoe UI', 'Malgun Gothic', sans-serif"><text x="64" y="55" fill="#3f6fa6" font-size="12" font-weight="600" letter-spacing="2">AI / LLM / FIELD NOTES</text><text x="64" y="103" fill="#243a55" font-size="32" font-weight="600" letter-spacing="-.5">From prompt to generation</text><text x="64" y="135" fill="#63758a" font-size="16">입력부터 다음 토큰 생성까지</text><g><rect x="64" y="192" width="240" height="128" rx="10" fill="#fff" stroke="#cad8e8"/><text x="82" y="220" fill="#70849b" font-size="11" letter-spacing="1">01 / INPUT</text><text x="82" y="260" fill="#2d527f" font-size="18" font-weight="600">PROMPT</text><text x="82" y="291" fill="#63758a" font-size="14">질문과 지시문</text></g><path d="M312 256H352" stroke="#7798bd" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect x="360" y="192" width="240" height="128" rx="10" fill="#fff" stroke="#cad8e8"/><text x="378" y="220" fill="#70849b" font-size="11" letter-spacing="1">02 / ENCODE</text><text x="378" y="260" fill="#2d527f" font-size="18" font-weight="600">TOKENS</text><text x="378" y="291" fill="#63758a" font-size="14">모델이 읽는 토큰 ID</text></g><path d="M608 256H648" stroke="#7798bd" stroke-width="1.5" marker-end="url(#arrow)"/><g><rect x="656" y="192" width="240" height="128" rx="10" fill="#fff" stroke="#cad8e8"/><text x="674" y="220" fill="#70849b" font-size="11" letter-spacing="1">03 / GENERATE</text><text x="674" y="260" fill="#2d527f" font-size="18" font-weight="600">LANGUAGE MODEL</text><text x="674" y="291" fill="#63758a" font-size="14">다음 토큰 생성 · 반복</text></g><path d="M64 358H896" stroke="#c7d5e6"/><text x="64" y="390" fill="#3f6fa6" font-family="monospace" font-size="14">PROMPT → TOKENS → NEXT TOKEN → REPEAT</text><text x="64" y="422" fill="#63758a" font-size="13">종료 조건에 도달할 때까지 생성합니다.</text><text x="896" y="445" fill="#3f6fa6" font-family="Georgia, serif" font-size="22" font-weight="700" text-anchor="end">deuk.</text></g></svg>
